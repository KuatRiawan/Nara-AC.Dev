# =========================================================================
#  NARA AC FRONTEND — Nginx Reverse Proxy with TLS/SSL Configuration
# =========================================================================

# -------------------------------------------------------------------------
# HTTP Server (Port 80)
# Automatically redirect all traffic to HTTPS, except health check & acme
# -------------------------------------------------------------------------
server {
    listen 80;
    server_name narateknindotama.duckdns.org localhost;

    # Health Check Endpoint (used by Docker healthcheck and monitoring)
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Let's Encrypt ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# HTTPS Server (Port 443)
# Primary production entrypoint with TLS encryption
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name narateknindotama.duckdns.org localhost;

    # SSL Certificates (managed by Let's Encrypt / entrypoint)
    ssl_certificate /etc/ssl/certs/nara-ac/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/nara-ac/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single Page Application (SPA) Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
    }

    # Proxy to Backend API
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10M;
    }

    # Proxy to AI Service
    location /ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
